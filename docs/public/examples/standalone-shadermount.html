<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="importmap">
      {
        "imports": {
          "@paper-design/shaders": "https://esm.sh/@paper-design/shaders@0.0.77"
        }
      }
    </script>
    <style>
      #box {
        width: 400px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div id="box"></div>

    <script type="module">
      import { ShaderMount, getShaderColorFromString } from '@paper-design/shaders';

      // language=GLSL
      const frag = `#version 300 es
        precision mediump float;

        uniform vec2  u_resolution;
        uniform float u_time;
        uniform vec4  u_color;

        out vec4 fragColor;

        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution;
          float wave = 0.5 + 0.5 * sin(u_time + uv.x * 6.2831 + uv.y * 3.0);
          fragColor = vec4(u_color.rgb * wave, 1.);
        }`;

      const el = document.querySelector('#box');
      const mount = new ShaderMount(
        el,
        frag,
        { u_color: getShaderColorFromString('#4d33cc') },
        undefined, // webGlContextAttributes
        1 // speed (>0 starts the animation loop)
      );
      window.mount = mount;
    </script>
  </body>
</html>
